<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Watchport</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header><strong>WATCHPORT</strong><span id="health">checking…</span></header>
    <section id="auth" class="card">
      <p class="eyebrow">PRIVATE DESKTOP VIEW</p>
      <h1>Your desktop, through a one-way window.</h1>
      <p>Passkey authentication is required in addition to Tailnet access.</p>
      <button id="authButton">Use passkey</button>
      <button id="registerButton" class="secondary" hidden>Enroll passkey on this host</button>
      <p id="message"></p>
    </section>
    <section id="viewer" hidden>
      <div class="toolbar"><span id="live">READY</span><button id="startButton">Open desktop</button><button id="stopButton" class="secondary" hidden>Close view</button></div>
      <iframe id="stream" title="View-only desktop stream" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
