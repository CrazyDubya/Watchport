[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchport"
version = "0.2.0"
description = "Passkey-gated, fail-closed, view-only desktop viewing control plane"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "webauthn>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[project.scripts]
watchport = "watchport.app:main"
watchport-indicator = "watchport.indicator:main"
watchport-bootstrap = "watchport.bootstrap:main"
watchport-doctor = "watchport.doctor:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
watchport = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
